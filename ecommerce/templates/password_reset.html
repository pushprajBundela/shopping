<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - ShopEase</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );
        }

        .reset-box {

            width: 400px;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 20px 50px rgba(0,0,0,0.2);

            animation: appear 0.6s ease;
        }

        @keyframes appear {

            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        h1 {
            text-align: center;

            color: #667eea;

            margin-bottom: 10px;
        }

        .description {

            text-align: center;

            color: #777;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 25px;
        }

        label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            color: #444;
        }

        input {

            width: 100%;

            padding: 13px;

            border: 1px solid #ddd;

            border-radius: 10px;

            outline: none;

            font-size: 15px;

            margin-bottom: 20px;
        }

        input:focus {

            border-color: #667eea;

            box-shadow:
                0 0 0 3px rgba(102,126,234,0.15);
        }

        button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 25px;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(102,126,234,0.3);
        }

        .back-login {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #667eea;

            text-decoration: none;

            font-size: 14px;
        }

        .back-login:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>

    <div class="reset-box">

        <h1>
            Forgot Password 🔐
        </h1>

        <p class="description">

            Enter your registered email address.
            We will send you a link to reset your password.

        </p>


        <form method="POST">

            {% csrf_token %}

            <label>
                Email Address
            </label>

            {{ form.email }}

            <button type="submit">
                Send Reset Link 📧
            </button>

        </form>


        <a
            href="{% url 'userlogin' %}"
            class="back-login"
        >
            ← Back to Login
        </a>

    </div>

</body>

</html>
