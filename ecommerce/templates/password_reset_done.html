<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Reset | E-Commerce</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 400px;
            max-width: 90%;
            background: white;
            padding: 40px 35px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            background: #eef2ff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
        }

        h1 {
            color: #222;
            font-size: 26px;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .info {
            background: #f5f7ff;
            padding: 12px;
            border-radius: 8px;
            color: #555;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .login-btn {
            display: inline-block;
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.35);
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">
            📧
        </div>

        <h1>Check Your Email</h1>

        <p>
            If an account exists with the email address you entered,
            we have sent a password reset link to your email.
        </p>

        <div class="info">
            💡 Please check your <strong>Inbox</strong> and
            <strong>Spam/Junk</strong> folder.
        </div>

        <a href="{% url 'userlogin' %}" class="login-btn">
            Back to Login
        </a>

        <div class="footer">
            © 2026 Your E-Commerce Website
        </div>

    </div>

</body>
</html>
